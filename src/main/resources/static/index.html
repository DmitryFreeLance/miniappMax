<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>СтройМаркет MAX Mini App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Prata&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css"/>
</head>
<body>
<div class="bg-shape bg-shape-1"></div>
<div class="bg-shape bg-shape-2"></div>

<div class="app-shell">
    <header class="app-header">
        <div>
            <h1>СтройМаркет</h1>
            <p>Каталог материалов и онлайн-заказ в MAX</p>
        </div>
        <div class="user-badge">
            <label for="userIdInput">Ваш MAX ID</label>
            <div class="user-row">
                <input id="userIdInput" type="number" placeholder="например, 10001"/>
                <button id="saveUserBtn" class="ghost">Сохранить</button>
            </div>
        </div>
    </header>

    <nav class="tabs">
        <button class="tab active" data-tab="catalog">Каталог</button>
        <button class="tab" data-tab="fix-price">Fix Price 🔥</button>
        <button class="tab" data-tab="info">Общая информация</button>
        <button class="tab" data-tab="admin">Админка</button>
    </nav>

    <main>
        <section id="catalog" class="tab-content active">
            <div id="catalogGrid" class="catalog-grid"></div>
            <div id="catalogEmpty" class="empty hidden">Товаров пока нет.</div>
        </section>

        <section id="fix-price" class="tab-content">
            <div id="fixPriceGrid" class="catalog-grid"></div>
            <div id="fixPriceEmpty" class="empty hidden">Товаров со скидкой пока нет.</div>
        </section>

        <section id="info" class="tab-content">
            <div id="infoPosts" class="post-list"></div>
        </section>

        <section id="admin" class="tab-content">
            <div class="admin-grid">
                <article class="panel">
                    <h3>Добавить товар</h3>
                    <form id="productForm">
                        <label>Фото товара
                            <input id="productImage" type="file" accept="image/*"/>
                        </label>
                        <label>Название
                            <input name="name" required/>
                        </label>
                        <label>Описание
                            <textarea name="description" required></textarea>
                        </label>
                        <label>Цена (₽)
                            <input name="price" type="number" step="0.01" min="0.01" required/>
                        </label>
                        <label>Раздел
                            <select id="sectionType" name="sectionType" required>
                                <option value="CATALOG">Каталог</option>
                                <option value="FIX_PRICE">Fix Price 🔥</option>
                            </select>
                        </label>
                        <label id="oldPriceWrapper" class="hidden">Старая цена (₽)
                            <input id="oldPriceInput" name="oldPrice" type="number" step="0.01" min="0.01"/>
                        </label>
                        <label>Формат количества
                            <select id="unitModeSelect" name="unitMode" required>
                                <option value="BOTH">И шт, и кубы</option>
                                <option value="PCS_ONLY">Только шт</option>
                                <option value="CUBIC_ONLY">Только кубы</option>
                            </select>
                        </label>
                        <label id="stockPcsWrapper">Остаток (шт)
                            <input id="stockPcsInput" name="stockPcs" type="number" step="0.001" min="0"/>
                        </label>
                        <label id="stockCubicWrapper">Остаток (куб.м)
                            <input id="stockCubicInput" name="stockCubicMeters" type="number" step="0.001" min="0"/>
                        </label>
                        <button type="submit">Сохранить товар</button>
                    </form>
                </article>

                <article class="panel">
                    <h3>Текстовый пост</h3>
                    <form id="postForm">
                        <label>Заголовок
                            <input name="title" required/>
                        </label>
                        <label>Текст
                            <textarea name="content" required></textarea>
                        </label>
                        <button type="submit">Опубликовать</button>
                    </form>
                </article>

                <article class="panel">
                    <h3>Админы</h3>
                    <form id="addAdminForm" class="row-form">
                        <input name="maxUserId" type="number" placeholder="MAX ID" required/>
                        <button type="submit">Добавить</button>
                    </form>
                    <div id="adminsList" class="mini-list"></div>
                </article>

                <article class="panel">
                    <h3>Пользователи</h3>
                    <div id="usersList" class="mini-list"></div>
                </article>

                <article class="panel wide">
                    <h3>Заказы</h3>
                    <div id="ordersList" class="mini-list"></div>
                </article>
            </div>
        </section>
    </main>
</div>

<div id="productModal" class="modal hidden">
    <div class="modal-card">
        <button class="close" id="closeProductModal">×</button>
        <img id="modalImage" alt="product"/>
        <h2 id="modalTitle"></h2>
        <p id="modalDescription"></p>
        <div id="modalOldPriceLine" class="old-price-line hidden"><span>Было:</span> <strong id="modalOldPrice"></strong></div>
        <div class="price-line"><span>Цена:</span> <strong id="modalPrice"></strong></div>
        <button id="orderBtn">Заказать</button>
    </div>
</div>

<div id="orderModal" class="modal hidden">
    <div class="modal-card">
        <button class="close" id="closeOrderModal">×</button>
        <h2>Оформление заказа</h2>

        <div id="orderStep1">
            <label>Количество
                <input id="orderQuantity" type="number" min="0.001" step="0.001" required/>
            </label>
            <label>Единица измерения
                <select id="orderUnit">
                    <option value="PCS">Штуки</option>
                    <option value="CUBIC_METERS">Кубометры</option>
                </select>
            </label>
            <button id="goStep2">Далее</button>
        </div>

        <div id="orderStep2" class="hidden">
            <label>ФИО
                <input id="orderFullName" required/>
            </label>
            <label>Телефон
                <input id="orderPhone" required/>
            </label>
            <label>Адрес доставки
                <textarea id="orderAddress" required></textarea>
            </label>
            <button id="submitOrder">Перейти к оплате</button>
        </div>

        <p id="orderMessage" class="status"></p>
    </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
