server:
  port: ${SERVER_PORT:8080}
  max-http-request-header-size: 16KB

spring:
  datasource:
    url: jdbc:sqlite:${APP_DB_PATH:app.db}?busy_timeout=${SQLITE_BUSY_TIMEOUT:10000}&journal_mode=WAL&synchronous=NORMAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: ${APP_DB_POOL_SIZE:1}
      minimum-idle: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: ${APP_MAX_FILE_SIZE:20MB}
      max-request-size: ${APP_MAX_REQUEST_SIZE:20MB}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  uploads-dir: ${APP_UPLOADS_DIR:uploads}
  bootstrap-admin-id: ${APP_BOOTSTRAP_ADMIN_ID:1}
  cors-origins: ${APP_CORS_ORIGINS:*}
  default-payment-details: ${APP_DEFAULT_PAYMENT_DETAILS:}
  city-delivery-fee: ${APP_CITY_DELIVERY_FEE:1000.00}
  max:
    token: ${MAX_BOT_TOKEN:}
    webhook-secret: ${MAX_WEBHOOK_SECRET:}
    miniapp-url: ${MAX_MINIAPP_URL:http://localhost:8080}
