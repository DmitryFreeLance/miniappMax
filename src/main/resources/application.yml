server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:sqlite:${APP_DB_PATH:app.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  jackson:
    default-property-inclusion: non_null

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  uploads-dir: ${APP_UPLOADS_DIR:uploads}
  bootstrap-admin-id: ${APP_BOOTSTRAP_ADMIN_ID:1}
  cors-origins: ${APP_CORS_ORIGINS:*}
  payment:
    mock-enabled: ${APP_PAYMENT_MOCK_ENABLED:false}
  max:
    token: ${MAX_BOT_TOKEN:}
    webhook-secret: ${MAX_WEBHOOK_SECRET:}
    miniapp-url: ${MAX_MINIAPP_URL:http://localhost:8080}
  yookassa:
    shop-id: ${YOOKASSA_SHOP_ID:}
    secret-key: ${YOOKASSA_SECRET_KEY:}
    return-url: ${YOOKASSA_RETURN_URL:http://localhost:8080/?payment=done}
